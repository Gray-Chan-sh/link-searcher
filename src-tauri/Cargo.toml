[workspace]
# 飞书 bot sidecar 与本包**拆成两个 crate**（2026-10-15，见 `docs/LARK_BOT.md` §5.7）：
# `bundle.externalBin` 要求"sidecar 文件必须先存在"，而 tauri-build 在**编译期**校验它。
# 若 bot 是本包的 bin，生成那个文件就必须先编本包 → 鸡生蛋。独立成 crate 后
# `cargo build -p lark-bot` **完全不触碰本包**，环就断了（顺带 sidecar 从 30 MB 降到几 MB）。
#
# ⚠️ workspace 根**同时是 package** 时，`cargo build` / `cargo test` 默认**只作用于本包**，
#    不会带上成员 crate。因此门禁命令必须显式加 `--workspace`，否则 `lark-gate` 的
#    准入判定测试会静默不跑 —— 而那段策略是"仅私聊 + 白名单"的**唯一防线**（AGENTS.md 门禁）。
members = ["lark-gate", "lark-bot"]

[package]
name = "link-searcher"
version = "1.2.2"
description = "Cross-platform full-text search desktop application"
authors = ["Link-Searcher"]
edition = "2024"
# 本包现在只有一个 bin（`link-searcher` 主程序；`lark-bot` 已拆到同名成员 crate）。
# 保留这个键的理由：`tauri dev` 用 `cargo run` 起应用，而 `cargo run` 在
# "本包 + workspace" 下需要它来消歧（历史上正是缺它导致 `tauri dev` 直接失败）。
default-run = "link-searcher"

[lib]
name = "link_searcher_lib"
# 桌面端只需要 rlib（src/main.rs 就是普通地调用这个 lib）。
# "cdylib"/"staticlib" 是 Tauri 移动端模板的遗留物，代价是每次构建都额外产出一个
# 2.4 GB 的 .lib 静态库 + 一个 .dll（实测 target/debug/deps/link_searcher_lib.lib
# = 2420 MB，连"无改动"的构建也会重写它，白吃磁盘 IO 与构建时间）。
# 将来要出 Android/iOS 包时再把 "cdylib", "staticlib" 加回来。
crate-type = ["lib"]

# Web API HTTP 冒烟测试需要在**进程主线程**构造真实 Wry AppHandle
# （tao 在 Windows 禁止非主线程创建事件循环），所以关掉 libtest harness。
[[test]]
name = "webapi_http"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tantivy = "0.22"
regex = "1"
jieba-rs = "0.10"
notify = { version = "7", features = ["macos_fsevent"] }
notify-debouncer-full = "0.4"
rayon = "1"
lopdf = "0.34"
calamine = "0.26"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
sha2 = "0.10"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
zip = { version = "2", features = ["aes-crypto"] }
image = "0.25"
imageproc = "0.25"
pure-onnx-ocr = "0.1"
tract-onnx = "0.20"
tokenizers = "0.20"
ab_glyph = "0.2"
encoding_rs = "0.8"
unicode-normalization = "0.1"
opener = "0.7"
anyhow = "1"
walkdir = "2"
glob = "0.3"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
dirs = "5"
anydoc = "0.1.6"
tar = "0.4.46"
flate2 = "1.1.9"
bzip2 = "0.6.1"
xz2 = "0.1.7"
hound = "3.5.1"
pdf-inspector = "1"
# Memory/进程用量采样（自适应并发闸门用）。只取 "system"：System 内存与进程 WS，
# 不需要 disk/network/component/user 那几个特性。
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
sherpa-onnx = "1.13"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
# POC: pure-Rust legacy .doc (Word 97-2003) extraction; docx feature unneeded
rwml = { version = "0.1", default-features = false }

# Web API server (optional remote access — default off)
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# MCP (Model Context Protocol) — debug-only AI agent integration.
# 固定上游 commit（不得改为本机绝对路径，否则 CI/其它机器无法解析）。
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", rev = "c7d271a06469bdf4744bfdeadca7458a1f3d02e5" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSDictionary"] }
objc2-vision = { version = "0.3", features = ["VNRecognizeTextRequest", "VNRequestHandler", "VNTypes", "VNDefines"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
] }
# Re-read user+machine PATH from the registry so tools installed (e.g. by
# winget) after the app started become visible without a restart.
winreg = "0.55"

[dev-dependencies]
dirs = "5"
tauri = { version = "2", features = ["test", "dynamic-acl"] }
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 业务代码（本 crate）的调试信息降到「行号级」：
# dev 默认 debug=2（全量）会把 rlib/pdb 撑到 GB 级并显著拖慢链接（实测
# link_searcher_lib.pdb 289 MB）。=1 仍保留 file:line 级回溯（panic 与日志够用），
# 只是调试器里看不到局部变量值。
[profile.dev]
debug = 1

# Debug 模式下所有第三方依赖开 O3，业务代码保持 O0 可调试
# tract-core/tract-linalg/tokenizers 等重度计算依赖由此获得 SIMD 加速
[profile.dev.package."*"]
opt-level = 3
# 依赖不生成调试信息：dev profile 默认 debug=2（全量），叠加 opt-level=3 后
# rustc 峰值内存与 target 体积都很大（target/debug 曾达 21.9GB）。
# 关掉依赖调试信息可大幅降低内存/磁盘，且不影响运行时性能；
# 业务代码（workspace 本 crate）仍保留完整调试信息。
debug = false

# release 不开 LTO：实测 `lto = "thin"` 对体积**没有帮助**（.text 62.2 → 62.9 MB，
# 85.3 MB 的 exe 相比 107.5 MB 的缩减全部来自去掉内嵌字体），却让首次打包多花约
# 6 分钟（改 lto 会迫使全部依赖重编一次）、之后每次多 1~2 分钟。本项目 exe 的体积
# 来自静态链接的推理栈（onnxruntime/sherpa-onnx + tract + tantivy），LTO 消不掉，
# 热点也在这些依赖内部。将来若真要压榨运行时性能再考虑打开。
[profile.release]
# lto = "thin"   # 2026-10-13 实测无体积收益，已移除
