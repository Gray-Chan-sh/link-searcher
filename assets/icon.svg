<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Magnifying glass glass -->
  <circle cx="240" cy="240" r="120" fill="none" stroke="white" stroke-width="28"/>
  <!-- Magnifying glass handle -->
  <line x1="330" y1="330" x2="410" y2="410" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Document hint lines inside glass -->
  <line x1="200" y1="220" x2="280" y2="220" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="200" y1="250" x2="260" y2="250" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="200" y1="280" x2="240" y2="280" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
</svg>