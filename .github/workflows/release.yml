name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.2.0）。用于手动补跑：tag-push 触发的 run 中 GITHUB_TOKEN 无法创建 release，需用 dispatch 手动触发。'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    # macOS 签名/公证：仓库 Secrets 就绪时 tauri-action 自动签名 + notarize；
    # secrets 缺省时这些 env 为空 → tauri 跳过签名（与 v1.1.1 之前的无签行为一致）。
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_PATH: /tmp/apple-api-key.p8

    steps:
      # dispatch 手动触发时 checkout 指定 tag；tag push 时 checkout 该 tag。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            patchelf

      - name: Install npm deps (incl. Tauri CLI)
        run: npm ci

      # 从 tag 同步版本号到 tauri.conf.json（tag v0.1.7 → version 0.1.7），
      # 产物文件名/app 版本与 release 一致。
      # - push tag：github.ref_name
      # - workflow_dispatch：inputs.tag
      # 用 `python` 而非 `python3`：Windows runner 无 python3（有 python）。
      - name: Set version from tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_TAG_INPUT}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          VER="${RELEASE_TAG#v}"
          python - "$VER" <<'PY'
          import json, sys
          ver = sys.argv[1]
          p = "src-tauri/tauri.conf.json"
          c = json.load(open(p))
          c["version"] = ver
          json.dump(c, open(p, "w"), indent=2, ensure_ascii=False)
          print(f"tauri.conf.json version -> {ver}")
          PY

      # macOS 证书导入：APPLE_CERTIFICATE 为 base64 的 .p12。Secrets 未配置时
      # 跳过（env.APPLE_CERTIFICATE 为空），构建保持无签名。
      - name: Import Apple certificate (macOS, if configured)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 18)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERT_PATH"
          echo "certificate imported: $(security find-identity -v -p codesigning | head -2)"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Link-Searcher v__VERSION__'
          releaseBody: 'See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/master/CHANGELOG.md) for details.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
