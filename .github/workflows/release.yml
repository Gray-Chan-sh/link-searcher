name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.2.0）。用于手动补跑：tag-push 触发的 run 中 GITHUB_TOKEN 无法创建 release，需用 dispatch 手动触发。'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      # dispatch 手动触发时 checkout 指定 tag；tag push 时 checkout 该 tag。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            patchelf

      - name: Install npm deps (incl. Tauri CLI)
        run: npm ci

      # 从 tag 同步版本号到 tauri.conf.json（tag v0.1.7 → version 0.1.7），
      # 产物文件名/app 版本与 release 一致。
      # - push tag：github.ref_name
      # - workflow_dispatch：inputs.tag
      # 用 `python` 而非 `python3`：Windows runner 无 python3（有 python）。
      - name: Set version from tag
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          VER="${RELEASE_TAG#v}"
          python - "$VER" <<'PY'
          import json, sys
          ver = sys.argv[1]
          p = "src-tauri/tauri.conf.json"
          c = json.load(open(p))
          c["version"] = ver
          json.dump(c, open(p, "w"), indent=2, ensure_ascii=False)
          print(f"tauri.conf.json version -> {ver}")
          PY

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Link-Searcher v__VERSION__'
          releaseBody: 'See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/master/CHANGELOG.md) for details.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
